<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 1120 850" width="100%" height="100%">
  <defs>
    <!-- Standard Arrow Marker (No Brutalist Styling) -->
    <marker id="arrow-up" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 7.5 5 L 1 8.5" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    
    <!-- Hard Offset Black Drop Shadow for Neo-Brutalism -->
    <filter id="brutal-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feOffset dx="6" dy="6" in="SourceAlpha" result="offset" />
      <feFlood flood-color="#000" result="color" />
      <feComposite in="color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip path for the Image Icon -->
    <clipPath id="brutal-clip">
      <rect x="634.5" y="650" width="155" height="140" rx="12" />
    </clipPath>
  </defs>

  <!-- Embedded CSS Animations -->
  <style>
    /* Keyframes */
    @keyframes fadeInAnim {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes dropInAnim {
      from { 
        opacity: 0; 
        transform: translateY(-25px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    @keyframes wipeUpAnim {
      0% { 
        clip-path: inset(100% 0% 0% 0%); 
        opacity: 0; 
      }
      1% { 
        opacity: 1; 
        clip-path: inset(100% 0% 0% 0%); 
      }
      100% { 
        clip-path: inset(0% 0% 0% 0%); 
        opacity: 1; 
      }
    }

    /* Animation Classes */
    .fade-in {
      opacity: 0;
      animation: fadeInAnim 0.4s ease-out forwards;
    }
    
    .drop-in {
      opacity: 0;
      animation: dropInAnim 0.4s ease-out forwards;
    }
    
    .wipe-up {
      opacity: 0;
      clip-path: inset(100% 0% 0% 0%);
      animation: wipeUpAnim 0.4s ease-out forwards;
    }
  </style>
  
  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g font-family="system-ui, -apple-system, Arial Black, sans-serif" font-weight="900">
    
    <!-- ================= STAGE 1: BOTTOM INPUTS ================= -->
    
    <!-- Left Flow (TEXT) Base -->
    <g class="fade-in" style="animation-delay: 0.0s;">
      <text x="120" y="735" text-anchor="end" font-size="32" fill="#000">TEXT</text>
      <rect x="151.6" y="650" width="400" height="150" rx="10" fill="#FFE83A" stroke="#000" stroke-width="4" filter="url(#brutal-shadow)" />
      <text x="351.6" y="700" text-anchor="middle" font-size="30" fill="#000">A MOUNTAINOUS</text>
      <text x="351.6" y="740" text-anchor="middle" font-size="30" fill="#000">LANDSCAPE LIT BY THE</text>
      <text x="351.6" y="780" text-anchor="middle" font-size="30" fill="#000">FULL MOON</text>
    </g>

    <!-- Right Flow (IMAGE) Base -->
    <g class="fade-in" style="animation-delay: 0.0s;">
      <text x="805" y="735" text-anchor="start" font-size="32" fill="#000">IMAGE</text>
      <rect x="634.5" y="650" width="155" height="140" rx="12" fill="#D2A8FF" stroke="#000" stroke-width="4" filter="url(#brutal-shadow)" />
      <g clip-path="url(#brutal-clip)">
        <circle cx="670" cy="685" r="18" fill="#FFE83A" stroke="#000" stroke-width="4" />
        <path d="M 640 800 L 745 680 L 820 760 L 820 800 Z" fill="#FF9ED2" stroke="#000" stroke-width="4" />
        <path d="M 600 800 L 610 760 L 675 710 L 750 800 Z" fill="#75E6A3" stroke="#000" stroke-width="4" />
      </g>
      <rect x="634.5" y="650" width="155" height="140" rx="12" fill="none" stroke="#000" stroke-width="4" />
    </g>

    <!-- ================= STAGE 2: INITIAL ARROWS GROW UP ================= -->
    
    <!-- Arrow 1 (Text to Tokens) -->
    <g class="wipe-up" style="animation-delay: 0.5s;">
      <!-- Invisible bounding box to fix SVG clip-path bounds -->
      <rect x="330" y="470" width="40" height="180" fill="none" pointer-events="none" />
      <line x1="351.6" y1="630" x2="351.6" y2="404" stroke="#000" stroke-width="3" marker-end="url(#arrow-up)" />
    </g>

    <!-- Arrow 2 (Image to E Module) -->
    <g class="wipe-up" style="animation-delay: 0.5s;">
      <rect x="690" y="610" width="40" height="40" fill="none" pointer-events="none" />
      <line x1="712" y1="640" x2="712" y2="620" stroke="#000" stroke-width="3" marker-end="url(#arrow-up)" />
    </g>


    <!-- ================= STAGE 3: MIDDLE LAYER CASCADE ================= -->
    
    <!-- Text Tokens Cascade (Left Side) -->
    <g class="drop-in" style="animation-delay: 0.8s;"><rect x="170" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 0.85s;"><rect x="212.4" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 0.9s;"><rect x="254.8" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 0.95s;"><rect x="297.2" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.0s;"><rect x="339.6" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.05s;"><rect x="382" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.1s;"><rect x="424.4" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.15s;"><rect x="466.8" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.2s;"><rect x="509.2" y="360" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>

    <g class="drop-in" style="animation-delay: 1.3s;">
      <text x="330" y="510" text-anchor="end" font-size="20" fill="#000">SEGMENTATION OF THE TEXT INTO</text>
      <text x="330" y="538" text-anchor="end" font-size="20" fill="#000">LEXICAL UNITS OF THE SUBWORD TYPE.</text>
    </g>

    <!-- Image Path Waterfall (Right Side) -->
    <!-- E Module Drops -->
    <g class="drop-in" style="animation-delay: 1.0s;">
      <path d="M 639.5 610 L 784.5 610 L 754.5 560 L 669.5 560 Z" fill="#75E6A3" stroke="#000" stroke-width="4" filter="url(#brutal-shadow)" />
      <text x="712" y="597" text-anchor="middle" font-size="28" fill="#000">E</text>
      <text x="805" y="580" text-anchor="start" font-size="20" fill="#000">PRE-TRAINED VQGAN</text>
      <text x="805" y="608" text-anchor="start" font-size="20" fill="#000">ENCODER MODULE</text>
    </g>

    <!-- Arrow 3 (E to Discretization) -->
    <g class="wipe-up" style="animation-delay: 1.3s;">
      <rect x="690" y="520" width="40" height="40" fill="none" pointer-events="none" />
      <line x1="712" y1="550" x2="712" y2="530" stroke="#000" stroke-width="3" marker-end="url(#arrow-up)" />
    </g>

    <!-- Discretization Drops -->
    <g class="drop-in" style="animation-delay: 1.5s;">
      <rect x="657" y="495" width="110" height="25" rx="5" fill="#FF9ED2" stroke="#000" stroke-width="4" filter="url(#brutal-shadow)" />
      <text x="805" y="515" text-anchor="start" font-size="20" fill="#000">DISCRETIZATION</text>
    </g>

    <!-- Arrow 4 (Discretization to Tokens) -->
    <g class="wipe-up" style="animation-delay: 1.8s;">
      <rect x="690" y="455" width="40" height="40" fill="none" pointer-events="none" />
      <line x1="712" y1="475" x2="712" y2="404" stroke="#000" stroke-width="3" marker-end="url(#arrow-up)" />
    </g>

    <!-- Middle Image Tokens Cascade -->
    <g class="drop-in" style="animation-delay: 2.0s;"><rect x="551.6" y="360" width="24" height="24" rx="4" fill="#75E6A3" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.05s;"><rect x="594" y="360" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.1s;"><rect x="636.4" y="360" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.15s;"><rect x="678.8" y="360" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.2s;"><rect x="721.2" y="360" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.25s;"><rect x="763.6" y="360" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.3s;"><rect x="806" y="360" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>

    <g class="drop-in" style="animation-delay: 2.4s;">
      <text x="712" y="420" text-anchor="middle" font-size="22" fill="#000">DISCRETE IMAGE</text>
      <text x="712" y="450" text-anchor="middle" font-size="22" fill="#000">REPRESENTATION</text>
    </g>


    <!-- ================= STAGE 4: MAIN MODEL DROPS IN ================= -->
    
    <g class="drop-in" style="animation-delay: 2.7s;">
      <!-- Body Background -->
      <g filter="url(#brutal-shadow)">
        <rect x="170" y="100" width="660" height="230" rx="10" fill="#FFE83A" stroke="#000" stroke-width="4" />
        <path d="M 170 170 L 830 170 L 830 110 Q 830 100 820 100 L 180 100 Q 170 100 170 110 Z" fill="#D2A8FF" stroke="#000" stroke-width="4" />
      </g>
      <text x="500" y="152" text-anchor="middle" font-size="36" fill="#000">INCREMENTAL LANGUAGE MODEL</text>

      <!-- Inner GPT Blocks -->
      <rect x="422.5" y="195" width="45" height="45" rx="8" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="445" y="228" text-anchor="middle" font-size="26" fill="#000">G</text>

      <rect x="477.5" y="195" width="45" height="45" rx="8" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="500" y="228" text-anchor="middle" font-size="26" fill="#000">P</text>

      <rect x="532.5" y="195" width="45" height="45" rx="8" fill="#75E6A3" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="555" y="228" text-anchor="middle" font-size="26" fill="#000">T</text>

      <!-- Bottom Inner Row -->
      <rect x="370" y="250" width="45" height="45" rx="8" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="392.5" y="283" text-anchor="middle" font-size="22" fill="#000">FR</text>

      <rect x="425" y="250" width="45" height="45" rx="8" fill="#D2A8FF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="447.5" y="283" text-anchor="middle" font-size="26" fill="#000">&gt;</text>

      <rect x="480" y="250" width="150" height="45" rx="8" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
    </g>


    <!-- ================= STAGE 5: FINAL OUTPUT TOKENS CASCADE ================= -->
    
    <g class="drop-in" style="animation-delay: 3.2s;"><rect x="170" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.25s;"><rect x="212.4" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.3s;"><rect x="254.8" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.35s;"><rect x="297.2" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.4s;"><rect x="339.6" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.45s;"><rect x="382" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.5s;"><rect x="424.4" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.55s;"><rect x="466.8" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.6s;"><rect x="509.2" y="50" width="24" height="24" rx="4" fill="#FF9ED2" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    
    <!-- SEP Token -->
    <g class="drop-in" style="animation-delay: 3.65s;"><rect x="551.6" y="50" width="24" height="24" rx="4" fill="#75E6A3" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    
    <g class="drop-in" style="animation-delay: 3.7s;"><rect x="594" y="50" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.75s;"><rect x="636.4" y="50" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.8s;"><rect x="678.8" y="50" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.85s;"><rect x="721.2" y="50" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.9s;"><rect x="763.6" y="50" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.95s;"><rect x="806" y="50" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>

    <!-- Final SEP Label -->
    <g class="drop-in" style="animation-delay: 4.1s;">
      <text x="563.6" y="35" text-anchor="middle" font-size="22" fill="#000">SEP TOKEN</text>
    </g>

  </g>
</svg>
