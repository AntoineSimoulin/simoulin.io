<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35 0 1000 850" width="100%" height="100%">
  <defs>
    <!-- Standard Arrow Marker (No Brutalist Styling) -->
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#000" />
    </marker>
    
    <!-- Hard Offset Black Drop Shadow for Neo-Brutalism -->
    <filter id="brutal-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feOffset dx="6" dy="6" in="SourceAlpha" result="offset" />
      <feFlood flood-color="#000" result="color" />
      <feComposite in="color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip path for the Output Image -->
    <clipPath id="image-clip">
      <rect x="432" y="40" width="130" height="110" rx="8" />
    </clipPath>
  </defs>

  <!-- Embedded CSS Animations -->
  <style>
    @keyframes fadeInAnim {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes dropInAnim {
      from { 
        opacity: 0; 
        transform: translateY(-25px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    @keyframes wipeUpAnim {
      0% { 
        clip-path: inset(100% 0% 0% 0%); 
        opacity: 0; 
      }
      1% { 
        opacity: 1; 
        clip-path: inset(100% 0% 0% 0%); 
      }
      100% { 
        clip-path: inset(0% 0% 0% 0%); 
        opacity: 1; 
      }
    }

    .fade-in {
      opacity: 0;
      animation: fadeInAnim 0.4s ease-out forwards;
    }
    
    .drop-in {
      opacity: 0;
      animation: dropInAnim 0.4s ease-out forwards;
    }
    
    .wipe-up {
      opacity: 0;
      clip-path: inset(100% 0% 0% 0%);
      animation: wipeUpAnim 0.4s ease-out forwards;
    }
  </style>
  
  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g font-family="system-ui, -apple-system, Arial Black, sans-serif" font-weight="900" font-size="20">
    
    <!-- ================= STAGE 1: BOTTOM TEXT INPUT ================= -->
    <g class="fade-in" style="animation-delay: 0.0s;">
      <!-- Text Label -->
      <text x="430" y="770" font-size="28" fill="#000">TEXT</text>
      
      <!-- Input Box -->
      <rect x="50" y="720" width="350" height="110" rx="10" fill="#FFE83A" stroke="#000" stroke-width="4" filter="url(#brutal-shadow)" />
      
      <text x="225" y="765" text-anchor="middle" font-size="26" fill="#000">A WORK OF ART IN</text>
      <text x="225" y="805" text-anchor="middle" font-size="26" fill="#000">THE CUBIC STYLE</text>
    </g>

    <!-- ================= STAGE 2: ARROW 1 ================= -->
    <g class="wipe-up" style="animation-delay: 0.5s;">
      <rect x="205" y="660" width="40" height="50" fill="none" pointer-events="none" />
      <line x1="225" y1="705" x2="225" y2="675" stroke="#000" stroke-width="3" marker-end="url(#arrow-up)" />
    </g>

    <!-- ================= STAGE 3: INPUT TOKENS & SEGMENTATION TEXT ================= -->
    <!-- Segmentation Text -->
    <g class="drop-in" style="animation-delay: 0.9s;">
      <text x="225" y="595" text-anchor="middle" font-size="20" fill="#000">SEGMENTATION OF THE TEXT INTO</text>
      <text x="225" y="625" text-anchor="middle" font-size="20" fill="#000">LEXICAL UNITS OF THE SUBWORD TYPE.</text>
    </g>

    <!-- Grey (Yellow Brutalist) Tokens -->
    <g class="drop-in" style="animation-delay: 1.00s;"><rect x="60" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.05s;"><rect x="94" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.10s;"><rect x="128" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.15s;"><rect x="162" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.20s;"><rect x="196" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.25s;"><rect x="230" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.30s;"><rect x="264" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.35s;"><rect x="298" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 1.40s;"><rect x="332" y="640" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <!-- Teal (Green Brutalist) Token -->
    <g class="drop-in" style="animation-delay: 1.45s;"><rect x="366" y="640" width="24" height="24" rx="4" fill="#75E6A3" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>

    <!-- ================= STAGE 4: INCREMENTAL LANGUAGE MODEL ================= -->
    <g class="drop-in" style="animation-delay: 2.0s;">
      <!-- Base Box -->
      <g filter="url(#brutal-shadow)">
        <rect x="50" y="370" width="560" height="190" rx="10" fill="#FF9ED2" stroke="#000" stroke-width="4" />
        <path d="M 50 430 L 610 430 L 610 380 Q 610 370 600 370 L 60 370 Q 50 370 50 380 Z" fill="#D2A8FF" stroke="#000" stroke-width="4" />
      </g>
      <!-- Header Text -->
      <text x="330" y="412" text-anchor="middle" font-size="30" fill="#000">INCREMENTAL LANGUAGE MODEL</text>

      <!-- Inner GPT Modules -->
      <rect x="230" y="450" width="35" height="35" rx="6" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="247.5" y="476" text-anchor="middle" font-size="22" fill="#000">G</text>

      <rect x="275" y="450" width="35" height="35" rx="6" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="292.5" y="476" text-anchor="middle" font-size="22" fill="#000">P</text>

      <rect x="320" y="450" width="35" height="35" rx="6" fill="#75E6A3" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="337.5" y="476" text-anchor="middle" font-size="22" fill="#000">T</text>

      <!-- Bottom Inner Row -->
      <rect x="210" y="500" width="35" height="35" rx="6" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="227.5" y="525" text-anchor="middle" font-size="18" fill="#000">FR</text>

      <rect x="255" y="500" width="35" height="35" rx="6" fill="#D2A8FF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
      <text x="272.5" y="525" text-anchor="middle" font-size="22" fill="#000">&gt;</text>

      <rect x="300" y="500" width="100" height="35" rx="6" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" />
    </g>

    <!-- ================= STAGE 5: OUTPUT TOKENS ================= -->
    <g class="drop-in" style="animation-delay: 2.5s;">
      <text x="610" y="325" font-size="20" fill="#000">DISCRETE REPRESENTATION OF</text>
      <text x="610" y="355" font-size="20" fill="#000">THE OUTPUT IMAGE</text>
    </g>

    <!-- 9 Grey (Yellow) Tokens -->
    <g class="drop-in" style="animation-delay: 2.60s;"><rect x="60" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.65s;"><rect x="94" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.70s;"><rect x="128" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.75s;"><rect x="162" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.80s;"><rect x="196" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.85s;"><rect x="230" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.90s;"><rect x="264" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 2.95s;"><rect x="298" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.00s;"><rect x="332" y="320" width="24" height="24" rx="4" fill="#FFE83A" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    
    <!-- 1 Teal (Green) Token -->
    <g class="drop-in" style="animation-delay: 3.05s;"><rect x="366" y="320" width="24" height="24" rx="4" fill="#75E6A3" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    
    <!-- 6 Dark Blue (Brutalist Blue) Tokens -->
    <g class="drop-in" style="animation-delay: 3.10s;"><rect x="400" y="320" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.15s;"><rect x="434" y="320" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.20s;"><rect x="468" y="320" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.25s;"><rect x="502" y="320" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.30s;"><rect x="536" y="320" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>
    <g class="drop-in" style="animation-delay: 3.35s;"><rect x="570" y="320" width="24" height="24" rx="4" fill="#A3CFFF" stroke="#000" stroke-width="3" filter="url(#brutal-shadow)" /></g>

    <!-- ================= STAGE 6: DECODER & IMAGE ================= -->
    <!-- Arrow 2 -->
    <g class="wipe-up" style="animation-delay: 3.8s;">
      <rect x="475" y="270" width="40" height="40" fill="none" pointer-events="none" />
      <line x1="497" y1="305" x2="497" y2="275" stroke="#000" stroke-width="3" marker-end="url(#arrow-up)" />
    </g>

    <!-- Decoder D -->
    <g class="drop-in" style="animation-delay: 4.1s;">
      <!-- Trapezoid base -->
      <path d="M 427 210 L 567 210 L 537 260 L 457 260 Z" fill="#FFE83A" stroke="#000" stroke-width="4" filter="url(#brutal-shadow)" />
      <text x="497" y="244" text-anchor="middle" font-size="26" fill="#000">D</text>
      
      <!-- Decoder Label -->
      <text x="590" y="225" font-size="22" fill="#000">DECODER MODULE OF THE</text>
      <text x="590" y="255" font-size="22" fill="#000">VQGAN PRE-TRAINED MODEL</text>
    </g>

    <!-- Arrow 3 -->
    <g class="wipe-up" style="animation-delay: 4.6s;">
      <rect x="475" y="160" width="40" height="40" fill="none" pointer-events="none" />
      <line x1="497" y1="195" x2="497" y2="165" stroke="#000" stroke-width="3" marker-end="url(#arrow-up)" />
    </g>

    <!-- Final Image Output -->
    <g class="drop-in" style="animation-delay: 4.9s;">
      <text x="497" y="25" text-anchor="middle" font-size="28" fill="#000">IMAGE</text>
      
      <!-- Image Container -->
      <rect x="432" y="40" width="130" height="110" rx="8" fill="#D2A8FF" stroke="#000" stroke-width="4" filter="url(#brutal-shadow)" />
      
      <!-- Cubic Art Inside Clip -->
      <g clip-path="url(#image-clip)">
        <!-- Base Background -->
        <rect x="432" y="40" width="130" height="110" fill="#D2A8FF" />
        
        <!-- Big Red Circle (Brutalist pure red) -->
        <circle cx="497" cy="80" r="35" fill="#FF0000" stroke="#000" stroke-width="4" />
        
        <!-- Abstract Shapes mimicking original's cubic layout -->
        <!-- Blue Bottom Right -->
        <path d="M 497 90 L 580 160 L 432 160 Z" fill="#0000FF" stroke="#000" stroke-width="4" />
        <!-- Cyan Top Left -->
        <path d="M 432 40 L 497 70 L 412 100 Z" fill="#00FFFF" stroke="#000" stroke-width="4" />
        <!-- Pink Top Right -->
        <path d="M 562 40 L 497 70 L 562 100 Z" fill="#FF9ED2" stroke="#000" stroke-width="4" />
      </g>
      
      <!-- Redraw outline so clipping doesn't chop off the outer border -->
      <rect x="432" y="40" width="130" height="110" rx="8" fill="none" stroke="#000" stroke-width="4" />
    </g>
    
  </g>
</svg>
